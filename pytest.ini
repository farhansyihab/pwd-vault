[pytest]
pythonpath = .
testpaths = tests
# Starlette menyarankan httpx2, tetapi project memakai httpx yang sudah disetujui.
# Peringatan ini diabaikan secara spesifik (bukan semua peringatan).
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
